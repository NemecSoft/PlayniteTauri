<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playnite</title>
    <style>
      /* Minimal guaranteed-visible boot screen so a "black screen" can be
         distinguished from HTML-not-loaded vs JS-not-executed. */
      #boot {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #171a1f; color: #9aa4b2; font: 14px sans-serif;
      }
      #boot.hidden { display: none; }
    </style>
    <script>
      // Capture any load-time JS error into title + a visible banner.
      window.__bootErr = null;
      window.addEventListener('error', function (e) {
        window.__bootErr = (e.error && e.error.message) || e.message || 'error';
        var el = document.getElementById('boot');
        if (el) { el.textContent = 'JS ERROR: ' + window.__bootErr; }
        document.title = 'ERR: ' + window.__bootErr;
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErr = 'rejection: ' + ((e.reason && e.reason.message) || e.reason);
        var el = document.getElementById('boot');
        if (el) { el.textContent = 'JS REJECTION: ' + window.__bootErr; }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Playnite loading...</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
